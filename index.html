    <style>
        /* Global Overscroll Prevention & PWA Layout Fixes */
        html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            background-color: #09090b;
        }

        body {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: pan-x pan-y;
            -webkit-user-select: none;
            user-select: none;
            background-color: #09090b;
        }

        /* GLOBALLY HIDE SCROLLBARS */
        ::-webkit-scrollbar {
            display: none;
        }
        html, body, div, section, main, aside, nav, ul, ol, li, textarea, pre {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* Screenplay Formatting Classes - Adjusted for RTL */
        .sp-slug { font-weight: 600; text-transform: uppercase; margin-top: 2rem; margin-bottom: 0.5rem; color: #e4e4e7; text-align: right; }
        .sp-action { margin-bottom: 1rem; color: #d4d4d8; line-height: 1.6; text-align: right; }
        .sp-character { text-align: center; width: 50%; margin: 1.5rem auto 0; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; color: #e4e4e7; }
        .sp-dialogue { text-align: center; width: 70%; margin: 0 auto 1rem; color: #d4d4d8; line-height: 1.5; }
        .sp-parenthetical { text-align: center; width: 50%; margin: 0 auto; font-size: 0.9em; color: #a1a1aa; }
        .sp-transition { text-align: left; text-transform: uppercase; margin-top: 1.5rem; margin-bottom: 1.5rem; color: #e4e4e7; }
        
        /* Novel Formatting Classes */
        .novel-content p {
            margin-bottom: 0.5rem;
            line-height: 1.8;
            text-align: justify;
            text-indent: 1.5em;
            color: #e4e4e7;
        }
        .novel-content p:first-of-type {
            text-indent: 0;
        }
        .novel-content h1 {
            font-size: 2em;
            font-weight: bold;
            text-align: center;
            margin-top: 2rem;
            margin-bottom: 2rem;
            color: #fff;
        }
        .novel-content h2 {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            color: #e4e4e7;
        }
        .novel-content blockquote {
            border-right: 2px solid #6366f1;
            padding-right: 1rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: #a1a1aa;
        }

        /* Ghost Text Animation */
        @keyframes ghost-pulse { 0% { opacity: 0.4; } 50% { opacity: 0.65; } 100% { opacity: 0.4; } }
        .ai-ghost { color: #818cf8; animation: ghost-pulse 2.5s infinite ease-in-out; }
    </style>
